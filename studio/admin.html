<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Úrsula Studio</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e9;--card:#fffdf9;--ink:#342822;--soft:#6f5d52;--acc:#b0785c;--line:#e6d9c8;--ok:#5f7a4a;--warn:#b5651d}
*{box-sizing:border-box}body{margin:0;font:14.5px/1.5 Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Playfair Display",serif;font-weight:500;margin:0 0 4px}h1 span{color:var(--acc);font-style:italic}
h2{font-family:"Playfair Display",serif;font-weight:500;font-size:22px;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{font-size:12.5px;color:var(--soft);display:block;margin-bottom:4px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:30px;padding:9px 16px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}.btn.sm{padding:6px 12px;font-size:13px}
.t-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.t-head b{font-size:17px;font-weight:600}.muted{color:var(--soft);font-size:13px}
.link{font-size:12.5px;background:#fff;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin-top:10px;display:flex;align-items:center;gap:10px}
.link span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.link .btn{flex:none;white-space:nowrap}
input[type=file]{padding:6px 8px;font-size:13px}.fn{margin-top:4px;word-break:break-all}
.ctl{display:flex;align-items:center;gap:8px}.ctl select{width:auto;padding:6px 28px 6px 12px;font-size:14px}.ctl .btn{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.pr{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;font-size:12.5px}
.pr .im{display:flex;gap:2px;height:120px}.pr img{flex:1;min-width:0;object-fit:cover}
.pr div.tx{padding:6px 8px;white-space:pre-line}
pre{white-space:pre-wrap;font:12.5px/1.45 Poppins,sans-serif;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
.post{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.post img,.post video{width:70px;height:88px;object-fit:cover;border-radius:8px;background:#000}
.st{font-weight:600}.st.aprobado,.st.publicado{color:var(--ok)}.st.cambios,.st.pendiente{color:var(--warn)}
details summary{cursor:pointer;font-weight:500;margin-top:10px}
.act{font-size:13px;border-top:1px solid var(--line);padding:6px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;display:none}
</style></head><body><div class="wrap">
<h1>Úrsula <span>Studio</span> · admin</h1><p class="muted" id="msg">Cargando…</p>
<div id="app" hidden>
<h2>Nueva tienda</h2>
<form class="card row" id="fNueva"><div><label>Nombre</label><input name="nombre" required></div><div><label>Instagram</label><input name="ig" placeholder="@tienda"></div><div><label>Email</label><input name="email"></div><div><label>Plan</label><select name="plan"><option value="prueba">Prueba</option><option value="basico">Básico</option><option value="estandar">Estándar</option><option value="pro">Pro</option></select></div><div><button class="btn">Crear y sacar enlace</button></div></form>
<h2>Tiendas</h2><div id="tiendas"></div>
<h2>Actividad reciente</h2><div class="card" id="act"></div>
</div></div><div class="toast" id="toast"></div>
<script>
const SB_URL='https://wailefezkkyhxnlcrlft.supabase.co', SB_KEY='sb_publishable_781896Ao3Whp-Hr2OOTNnw_Ou51Jt0F';
const KEY=new URLSearchParams(location.hash.slice(1)).get('k')||'';
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};
async function rpc(fn,args){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||('Error '+r.status));return j}
async function subir(file,tid){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`t/${tid}/post-${Date.now()}.${ext}`;const r=await fetch(`${SB_URL}/storage/v1/object/studio/${path}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':file.type||'application/octet-stream'},body:file});if(!r.ok)throw new Error('No se pudo subir: '+(await r.text()).slice(0,120));return `${SB_URL}/storage/v1/object/public/studio/${path}`}
const panelURL=t=>`${location.origin}${location.pathname.replace(/admin\.html$/,'')}mi-panel.html#t=${t}`;
function ficha(f){if(!f||!Object.keys(f).length)return 'Todavía no la completó.';const l=(k,v)=>v&&(Array.isArray(v)?v.length:String(v).trim())?`${k}: ${Array.isArray(v)?v.map(x=>Array.isArray(x)?x.join(' → '):x).join(Array.isArray(v[0])?'\n  - ':', '):v}\n`:'';
 return l('TIENDA',f.tienda)+l('IG',f.ig)+l('QUÉ VENDE',f.frase)+l('DIRECCIÓN',f.dir)+l('HORARIO',f.horario)+l('WEB',f.web)+l('CÓMO SE COMPRA',f.compra)+l('ENVÍOS',f.envios)+l('DEVOLUCIONES',f.devol)+l('PAGO',f.pago)+l('TALLAS',f.tallaje)+l('TONO',f.tono)+l('LUGARES',f.lugares)+l('NO QUIERE',f.no)+l('HASHTAGS',f.tags)+(f.faqs&&f.faqs.length?'PREGUNTAS:\n  - '+f.faqs.map(x=>x.join(' → ')).join('\n  - ')+'\n':'')+l('PASA A LA TIENDA',f.pasar)+l('AVISO',f.aviso)+l('FIRMA',f.firma)}
async function cargar(){let d;try{d=await rpc('studio_admin_resumen',{p_key:KEY})}catch(e){$('#msg').textContent='Sin acceso: '+e.message;return}
 $('#msg').textContent=`${d.tiendas.length} tienda(s)`;$('#app').hidden=false;
 $('#tiendas').innerHTML=d.tiendas.map(t=>`<div class="card" data-id="${t.id}"><div class="t-head"><div><b>${esc(t.nombre)}</b> <span class="muted">${esc(t.instagram||'')} · ${esc(t.plan)} · ${t.prendas} prendas${t.activa?'':' · INACTIVA'}</span></div>
  <div class="ctl"><select data-plan="${t.id}">${['prueba','basico','estandar','pro'].map(p=>`<option ${p===t.plan?'selected':''}>${p}</option>`).join('')}</select> <button class="btn ghost sm" data-act="${t.id}" data-v="${!t.activa}">${t.activa?'Desactivar':'Activar'}</button></div></div>
  <div class="link"><span>${esc(panelURL(t.token))}</span> <button class="btn sm" data-copy="${esc(panelURL(t.token))}">Copiar enlace</button></div>
  <details><summary>Prendas (${t.prendas})</summary><div class="grid">${(t.lista_prendas||[]).map(p=>`<div class="pr"><div class="im">${(p.fotos||[]).map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join('')}</div><div class="tx"><b>${esc(p.nombre)}</b>${p.precio?' · '+esc(p.precio)+' €':''}\n${esc([p.tallas,p.colores].filter(Boolean).join(' · '))}\n${esc(p.notas||'')}</div></div>`).join('')||'<span class="muted">Sin prendas</span>'}</div></details>
  <details><summary>Ficha del asistente</summary><pre>${esc(ficha(t.ficha))}</pre><button class="btn ghost sm" data-copyf="${t.id}">Copiar ficha</button></details>
  <details open><summary>Publicaciones (${t.posts.length})</summary>${t.posts.map(p=>`<div class="post">${p.media_url?(/\.mp4/i.test(p.media_url)?`<video src="${esc(p.media_url)}" muted></video>`:`<img src="${esc(p.media_url)}" alt="">`):''}<div style="flex:1"><b>${esc(p.tipo)}</b> · ${esc(p.fecha||'sin fecha')} · <span class="st ${esc(p.estado)}">${esc(p.estado)}</span>${p.comentario?'<br>💬 '+esc(p.comentario):''}<br><span class="muted">${esc(p.titulo||'')} ${esc((p.caption||'').slice(0,140))}</span></div><div>${p.estado!=='publicado'?`<button class="btn ghost sm" data-pub="${p.id}">Marcar publicado</button>`:''}</div></div>`).join('')}
   <form class="row" data-newpost="${t.id}" style="margin-top:10px"><div><label>Tipo</label><select name="tipo"><option>reel</option><option>carrusel</option><option>historia</option></select></div><div><label>Fecha</label><input type="date" name="fecha"></div><div><label>Título</label><input name="titulo"></div><div style="grid-column:1/-1"><label>Texto (caption)</label><textarea name="caption"></textarea></div><div><label>Archivo (vídeo o foto)</label><input type="file" name="file" accept="image/*,video/mp4" onchange="this.nextElementSibling.textContent=this.files[0]?'📎 '+this.files[0].name:''"><div class="muted fn"></div></div><div><button class="btn">Subir para aprobar</button></div></form></details></div>`).join('')||'<div class="card muted">Todavía no hay tiendas.</div>';
 window._d=d;
 $('#act').innerHTML=d.actividad.map(a=>`<div class="act">${new Date(a.creado).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · <b>${esc(a.nombre||'')}</b> · ${esc(a.que)}</div>`).join('')||'<span class="muted">Sin actividad</span>'}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.copy){navigator.clipboard.writeText(b.dataset.copy);toast('Enlace copiado')}
 if(b.dataset.copyf){const t=_d.tiendas.find(x=>x.id===b.dataset.copyf);navigator.clipboard.writeText(ficha(t.ficha));toast('Ficha copiada')}
 if(b.dataset.act){await rpc('studio_admin_tienda',{p_key:KEY,p_id:b.dataset.act,p_plan:null,p_activa:b.dataset.v==='true'});cargar()}
 if(b.dataset.pub){await rpc('studio_admin_post',{p_key:KEY,p_datos:{id:b.dataset.pub,estado:'publicado'}});toast('Marcado como publicado');cargar()}});
document.addEventListener('change',async e=>{const s=e.target.closest('[data-plan]');if(!s)return;await rpc('studio_admin_tienda',{p_key:KEY,p_id:s.dataset.plan,p_plan:s.value,p_activa:null});toast('Plan cambiado')});
document.addEventListener('submit',async e=>{const f=e.target;if(f.id==='fNueva'){e.preventDefault();const x=new FormData(f);try{const r=await rpc('studio_admin_crear_tienda',{p_key:KEY,p_nombre:x.get('nombre'),p_instagram:x.get('ig'),p_email:x.get('email'),p_plan:x.get('plan')});navigator.clipboard.writeText(panelURL(r.token)).catch(()=>{});toast('Tienda creada. Enlace copiado');f.reset();cargar()}catch(err){toast(err.message)}}
 if(f.dataset.newpost){e.preventDefault();const x=new FormData(f);const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Subiendo…';try{let url=null;const file=x.get('file');if(file&&file.size)url=await subir(file,f.dataset.newpost);await rpc('studio_admin_post',{p_key:KEY,p_datos:{tienda_id:f.dataset.newpost,tipo:x.get('tipo'),fecha:x.get('fecha')||null,titulo:x.get('titulo'),caption:x.get('caption'),media_url:url}});toast('Subido. La tienda ya lo ve para aprobar');cargar()}catch(err){toast(err.message);btn.disabled=false;btn.textContent='Subir para aprobar'}}});
if(!KEY)$('#msg').textContent='Falta la clave (#k=…)';else cargar();
</script></body></html>
